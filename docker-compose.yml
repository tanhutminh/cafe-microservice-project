# Settings shared by the six backend services, merged into each with `<<: *backend-service`. The
# merge is shallow, so each service still spells out its own `build` section. mem_limit matches the
# Helm chart's memory limit, so the JVM sizes its heap (MaxRAMPercentage in backend/Dockerfile) the
# same way here as on GKE. memswap_limit, memory plus swap, is the same value, so the container
# gets no swap: unset, Docker would allow as much swap again, and a container that outgrows its
# limit would swap here where GKE, whose nodes have no swap by default, kills it. cpus matches the
# chart's CPU limit, so the JVM sees one processor here as on GKE and sizes its thread pools the
# same way; a service also starts more slowly than it would without the limit.
# stop_grace_period is how long Docker waits after SIGTERM before it kills a service being stopped
# or replaced: 30s, as Kubernetes' default terminationGracePeriodSeconds, which the chart keeps.
# Docker's own default can be shorter than a service needs to shut down gracefully and exit.
# The restart policy is unless-stopped, as on postgres, kafka, kafka-ui and zipkin. Docker restarts
# the container whenever it exits, as Kubernetes restarts a Deployment's containers, and starts it
# again when the Docker daemon restarts. It does neither for a container stopped by hand
# (`docker compose stop` or `docker compose kill`). The daemon starts all these containers at once,
# without depends_on's order or health conditions, so a service that reaches Postgres before it is
# ready exits and is restarted until it connects.
x-backend-service: &backend-service
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 0.5
  stop_grace_period: 30s
  restart: unless-stopped

services:
  postgres:
    # The comment above the version in k8s/data-layer/postgres-cluster.yaml lists every place to
    # change with it.
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Consumed by docker/postgres-init/init-db.sh to create each service's own role - not
      # read by the postgres image itself, only by our own init script.
      AUTH_SERVICE_DB_USERNAME: ${AUTH_SERVICE_DB_USERNAME}
      AUTH_SERVICE_DB_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      MENU_SERVICE_DB_USERNAME: ${MENU_SERVICE_DB_USERNAME}
      MENU_SERVICE_DB_PASSWORD: ${MENU_SERVICE_DB_PASSWORD}
      ORDER_SERVICE_DB_USERNAME: ${ORDER_SERVICE_DB_USERNAME}
      ORDER_SERVICE_DB_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      INVENTORY_SERVICE_DB_USERNAME: ${INVENTORY_SERVICE_DB_USERNAME}
      INVENTORY_SERVICE_DB_PASSWORD: ${INVENTORY_SERVICE_DB_PASSWORD}
      REPORT_SERVICE_DB_USERNAME: ${REPORT_SERVICE_DB_USERNAME}
      REPORT_SERVICE_DB_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD}
    ports:
      - "5432:5432"
    # Since Postgres 18 the image keeps its data in a subdirectory per major version
    # (/var/lib/postgresql/<major>/docker), so that one volume, mounted at /var/lib/postgresql,
    # can hold an old and a new major version side by side for pg_upgrade --link. The entrypoint,
    # though, initializes a new data directory only on a volume that holds no other version's
    # data, in the old /var/lib/postgresql/data layout or the new one; otherwise it exits. So the
    # volume is named after the major version: a new major version starts on a new, empty volume,
    # and moving the data to it takes a dump and restore, or pg_upgrade, which needs both versions'
    # binaries and so can't run in this image alone.
    # README.md's "Moving to a new Postgres major version" has the dump-and-restore steps.
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Connects to report_db, the last database docker/postgres-init/init-db.sh creates, so the
      # check passes only once that script has run to the end. If the script fails partway, the
      # entrypoint exits, the restart policy starts the container again, and the entrypoint, now
      # finding a data directory, skips the init scripts: the server runs without some services'
      # roles and databases, and this check keeps it unhealthy, so `docker compose up` stops with
      # "dependency failed to start" rather than starting the services (README.md's Troubleshooting
      # has the fix).
      # -h localhost connects over TCP: while the init scripts run, the entrypoint's temporary
      # server accepts connections on the Unix socket only, so the check can't pass before the
      # entrypoint has replaced it with the real server. The image's pg_hba.conf trusts TCP
      # connections from localhost, so no password is needed. The check logs in as POSTGRES_USER,
      # a role the image creates only when it initializes a new volume, so changing DB_USERNAME in
      # .env afterwards makes the check fail until it's changed back.
      test: ["CMD-SHELL", "psql -h localhost -U \"$${POSTGRES_USER}\" -d report_db -Atc 'SELECT 1'"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # The comment above the version in k8s/data-layer/kafka-cluster.yaml lists every place to
    # change with it.
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for other containers on the compose network (advertised as "kafka");
      # PLAINTEXT_HOST is for services run natively on the host machine (e.g. from an IDE),
      # advertised as "localhost" so the client's follow-up metadata/coordinator connections
      # don't try to resolve the unreachable "kafka" hostname from outside Docker.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: cafe
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:3.6.1@sha256:d17e856dcbba7ffeefbbfc252f89ab78a4ab6faed47e646d46daad78f91b5ee2
    restart: unless-stopped
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: gateway
    environment:
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      # Sourced from .env (see .env.example) - not used for the real K8s deployment, which
      # sources a separately-generated keypair from GCP Secret Manager instead.
      APP_JWT_PUBLIC_KEY: ${GATEWAY_JWT_PUBLIC_KEY}
    depends_on:
      zipkin:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_db"
      SPRING_DATASOURCE_USERNAME: ${AUTH_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      # Sourced from .env (see .env.example) - not used for the real K8s deployment, which
      # sources a separately-generated keypair from GCP Secret Manager instead.
      APP_JWT_PRIVATE_KEY: ${AUTH_SERVICE_JWT_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  menu-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: menu-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/menu_db"
      SPRING_DATASOURCE_USERNAME: ${MENU_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MENU_SERVICE_DB_PASSWORD}
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  order-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: order-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: ${ORDER_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  inventory-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: inventory-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/inventory_db"
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  report-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: report-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/report_db"
      SPRING_DATASOURCE_USERNAME: ${REPORT_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres18-data:
