# Settings shared by the six backend services, merged into each with `<<: *backend-service`. The
# merge is shallow, so each service still spells out its own `build` section. mem_limit matches the
# Helm chart's memory limit, so the JVM sizes its heap (MaxRAMPercentage in backend/Dockerfile) the
# same way here as on GKE. memswap_limit, memory plus swap, is the same value, so the container
# gets no swap: unset, Docker would allow as much swap again, and a container that outgrows its
# limit would swap here where GKE, whose nodes have no swap by default, kills it.
x-backend-service: &backend-service
  mem_limit: 512m
  memswap_limit: 512m

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Consumed by docker/postgres-init/init-db.sh to create each service's own role - not
      # read by the postgres image itself, only by our own init script.
      AUTH_SERVICE_DB_USERNAME: ${AUTH_SERVICE_DB_USERNAME}
      AUTH_SERVICE_DB_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      MENU_SERVICE_DB_USERNAME: ${MENU_SERVICE_DB_USERNAME}
      MENU_SERVICE_DB_PASSWORD: ${MENU_SERVICE_DB_PASSWORD}
      ORDER_SERVICE_DB_USERNAME: ${ORDER_SERVICE_DB_USERNAME}
      ORDER_SERVICE_DB_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      INVENTORY_SERVICE_DB_USERNAME: ${INVENTORY_SERVICE_DB_USERNAME}
      INVENTORY_SERVICE_DB_PASSWORD: ${INVENTORY_SERVICE_DB_PASSWORD}
      REPORT_SERVICE_DB_USERNAME: ${REPORT_SERVICE_DB_USERNAME}
      REPORT_SERVICE_DB_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for other containers on the compose network (advertised as "kafka");
      # PLAINTEXT_HOST is for services run natively on the host machine (e.g. from an IDE),
      # advertised as "localhost" so the client's follow-up metadata/coordinator connections
      # don't try to resolve the unreachable "kafka" hostname from outside Docker.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: cafe
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: gateway
    environment:
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      # Sourced from .env (see .env.example) - not used for the real K8s deployment, which
      # sources a separately-generated keypair from GCP Secret Manager instead.
      APP_JWT_PUBLIC_KEY: ${GATEWAY_JWT_PUBLIC_KEY}
    depends_on:
      zipkin:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_db"
      SPRING_DATASOURCE_USERNAME: ${AUTH_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      # Sourced from .env (see .env.example) - not used for the real K8s deployment, which
      # sources a separately-generated keypair from GCP Secret Manager instead.
      APP_JWT_PRIVATE_KEY: ${AUTH_SERVICE_JWT_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  menu-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: menu-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/menu_db"
      SPRING_DATASOURCE_USERNAME: ${MENU_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MENU_SERVICE_DB_PASSWORD}
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  order-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: order-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: ${ORDER_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  inventory-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: inventory-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/inventory_db"
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  report-service:
    <<: *backend-service
    build:
      context: ./backend
      args:
        SERVICE: report-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/report_db"
      SPRING_DATASOURCE_USERNAME: ${REPORT_SERVICE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
