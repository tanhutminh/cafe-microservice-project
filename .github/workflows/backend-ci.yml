name: backend-ci

on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      scripts: ${{ steps.filter.outputs.scripts }}
      charts: ${{ steps.filter.outputs.charts }}
      k8s: ${{ steps.filter.outputs.k8s }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            # .gitignore too: deploy.sh's repo-state check and deploy.test.sh's cases rely on its
            # patterns (target/, *-local.yml, charts/*/charts/*.tgz).
            scripts:
              - 'scripts/**'
              - '.gitignore'
            charts:
              - 'charts/**'
            k8s:
              - 'k8s/**'
            # This file itself: every job and step gated on the outputs above also runs when it
            # changes, so an edit to any step is exercised on the same PR (and deploy.test.sh,
            # which reads this file, reruns).
            workflow:
              - '.github/workflows/backend-ci.yml'

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for accidentally-committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  test:
    needs: changes
    # `charts` and `k8s` too: deploy.test.sh checks deploy.sh against files under charts/ and
    # k8s/data-layer/, and this job lints and tests the chart's own wait-for-db initContainer script
    # (charts/*/files/).
    if: >-
      success() && (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.scripts == 'true' ||
        needs.changes.outputs.charts == 'true' ||
        needs.changes.outputs.k8s == 'true' ||
        needs.changes.outputs.workflow == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Maven checks take ~2 minutes, so a PR that changes neither backend code nor this file
      # skips them. On master they run whenever this job does, matching build-and-push's own gate:
      # an image is only ever pushed from a run that tested the backend tree it was built from.
      RUN_BACKEND: >-
        ${{
          needs.changes.outputs.backend == 'true' ||
          needs.changes.outputs.workflow == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/master'
        }}
    # The script checks and the Maven checks are two independent groups: each runs even if the
    # other failed (`!cancelled()` instead of the default `success()`), so a failure in one group
    # never hides the other's result. Each Maven check still needs the previous one to succeed.
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned by image digest rather than whatever shellcheck the runner image ships; the runbook
      # documents the same command for running the lint locally. GitHub documents Docker Hub's rate
      # limit as not applied to public pulls from GitHub-hosted runners; an outage or a rare 429
      # fails this step - rerun the failed job.
      - name: Lint scripts (shellcheck)
        timeout-minutes: 2
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x scripts/*.sh charts/*/files/*.sh

      - name: Test the image-tag script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        run: bash scripts/image-tag.test.sh

      - name: Test the wait-for-db script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        run: bash charts/cafe-service/files/wait-for-db.test.sh

      # It runs deploy.sh end to end dozens of times, each spawning git and the fakes: seconds on
      # Linux, about 2 minutes under Git Bash on Windows. Its 5-minute limit, above the other script
      # steps' 2, is headroom for a slow or contended runner, not an expected duration.
      - name: Test the deploy script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/deploy.test.sh

      - id: java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && env.RUN_BACKEND == 'true' }}
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - id: spotless
        name: Check code formatting (Spotless)
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        working-directory: backend
        run: mvn -q spotless:check

      - id: mvntest
        name: Run full reactor test suite
        if: ${{ !cancelled() && steps.spotless.outcome == 'success' }}
        working-directory: backend
        run: mvn -q test

      - name: Enforce per-module coverage floor (no-regression ratchet)
        if: ${{ !cancelled() && steps.mvntest.outcome == 'success' }}
        working-directory: backend
        run: mvn -q -pl common-lib,auth-service,menu-service,order-service,inventory-service jacoco:check

  validate-manifests:
    needs: changes
    if: >-
      success() && (
        needs.changes.outputs.charts == 'true' ||
        needs.changes.outputs.k8s == 'true' ||
        needs.changes.outputs.workflow == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_KUBECONFORM: >-
        ${{
          needs.changes.outputs.k8s == 'true' ||
          needs.changes.outputs.workflow == 'true' ||
          github.event_name == 'workflow_dispatch'
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard against data-layer resources leaking into the Helm-managed app chart
        run: |
          if grep -rlE 'apiVersion: (postgresql\.cnpg\.io|kafka\.strimzi\.io|barmancloud\.cnpg\.io)|^kind: (StorageClass|ScheduledBackup)' charts/*/templates/ 2>/dev/null; then
            echo "::error::A data-layer resource type was found under charts/**/templates/ - these belong in k8s/data-layer/ as plain manifests, not the Helm-managed app chart."
            exit 1
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        # Pinned for reproducible lint/render results; the default is whatever Helm is latest.
        with:
          version: v4.3.0

      - name: helm dependency build
        run: helm dependency build --skip-refresh charts/cafe

      # The render check below already fails if files/wait-for-db.sh is missing (`required` in the
      # Deployment template); this catches the opposite leak: test suites Helm should have ignored.
      - name: Check the packaged cafe-service subchart's files
        run: |
          contents=$(tar tzf charts/cafe/charts/cafe-service-*.tgz)
          if grep -E '\.test\.sh$' <<< "$contents"; then
            echo "::error::test suites leaked into the packaged cafe-service chart (.helmignore)"
            exit 1
          fi

      - name: helm lint
        run: helm lint charts/cafe

      # One full render per service, printing only that service's ConfigMap: each render fails on a
      # template error, and each ConfigMap must turn Zipkin span export off, since no Zipkin
      # collector runs in the cluster (global.tracing.export.zipkin.enabled in charts/cafe).
      - name: helm template (render check)
        run: |
          services=(gateway auth-service menu-service order-service inventory-service report-service)
          set_args=()
          for svc in "${services[@]}"; do
            set_args+=(--set-string "${svc}.image.tag=ci-check")
          done
          for svc in "${services[@]}"; do
            rendered=$(helm template charts/cafe -n cafe "${set_args[@]}" \
              --show-only "charts/$svc/templates/configmap.yaml")
            if ! grep -A1 'zipkin:' <<< "$rendered" | grep -q 'enabled: false'; then
              echo "::error::$svc's ConfigMap doesn't turn Zipkin span export off"
              exit 1
            fi
          done

      - name: Install kubeconform
        if: env.RUN_KUBECONFORM == 'true'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Both schema sources are pinned to a commit (the first is kubeconform's own default location,
      # which otherwise tracks master). Nothing updates these automatically: refresh with
      # `git ls-remote <repo> HEAD`, and always refresh the CRDs-catalog pin when the CNPG, Strimzi
      # or barman-cloud version pinned in k8s/ changes, or their manifests are checked against old
      # CRD schemas.
      - name: Validate k8s/data-layer manifests against real CRD schemas
        if: env.RUN_KUBECONFORM == 'true'
        run: |
          kubeconform -strict \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/a6f9a32d2ccb64b6e4f5b41419b9c2e8ee0cce18/{{ .NormalizedKubernetesVersion }}-standalone{{ .StrictSuffix }}/{{ .ResourceKind }}{{ .KindSuffix }}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/data-layer/*.yaml

  build-and-push:
    needs: [test, gitleaks]
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run at a time per service: two master runs close together compute the same tag for an
    # unchanged service, and without this the second could check before the first pushed, rebuild,
    # and have its push refused by the immutable tags. With `queue: max`, runs of this job for one
    # service wait in the group rather than replacing each other, so whichever runs second checks
    # only after the first has finished, and skips the build if the first pushed the image.
    concurrency:
      group: build-and-push-${{ matrix.service }}
      queue: max
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, menu-service, order-service, inventory-service, report-service]
    env:
      IMAGE: us-central1-docker.pkg.dev/cafe-microservices/cafe-images/cafe-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the image's content-hash tag
        id: tag
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          tag="$(bash scripts/image-tag.sh "$SERVICE")"
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/271893052132/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-ci@cafe-microservices.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Any failure here (not only "no such tag") counts as "missing" and falls through to the
      # build; a real auth or network problem then fails loudly at the push instead. If the image
      # did exist and only this check failed transiently, the rebuilt image has a different
      # digest and the repository's immutable tags refuse the push, so the job fails - rerun the
      # failed job.
      - name: Check whether this content already has an image
        id: exists
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if out="$(docker manifest inspect "$IMAGE:$IMAGE_TAG" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No image found for $IMAGE:$IMAGE_TAG (docker said: $out)"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.exists == 'false'

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
