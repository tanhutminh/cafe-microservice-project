<div class="login-page">
  <div class="lang-bar">
    <app-language-switcher></app-language-switcher>
  </div>

  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>{{ 'common.appName' | transloco }}</mat-card-title>
      <mat-card-subtitle>{{ 'auth.subtitle' | transloco }}</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.username' | transloco }}</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.password' | transloco }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (loginFailed()) {
          <p class="error">{{ 'auth.invalidCredentials' | transloco }}</p>
        }
      </mat-card-content>

      <mat-card-actions>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            {{ 'auth.login' | transloco }}
          }
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
