<div class="home-page">
  <div class="lang-bar">
    <app-language-switcher></app-language-switcher>
  </div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'common.appName' | transloco }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (authService.currentUser(); as user) {
        <p>
          {{ 'home.welcome' | transloco: { name: user.fullName, role: ('role.' + user.role | transloco) } }}
        </p>
      } @else {
        <p>{{ 'home.loadingUser' | transloco }}</p>
      }
      <p class="note">{{ 'home.comingSoon' | transloco }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-stroked-button (click)="logout()">{{ 'auth.logout' | transloco }}</button>
    </mat-card-actions>
  </mat-card>
</div>
