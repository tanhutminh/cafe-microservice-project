<h2 mat-dialog-title>{{ 'inventoryAdmin.stockIn' | transloco: { name: data.ingredient.name } }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'inventoryAdmin.quantity' | transloco }}</mat-label>
      <input matInput type="number" formControlName="quantity" />
      <mat-hint>{{ data.ingredient.unit }} - {{ 'inventoryAdmin.currentStock' | transloco }}: {{ data.ingredient.currentStock }}</mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      {{ 'common.save' | transloco }}
    </button>
  </mat-dialog-actions>
</form>
