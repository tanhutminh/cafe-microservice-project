apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cafe-postgres-retain
  labels: {app.kubernetes.io/managed-by: kubectl}
provisioner: pd.csi.storage.gke.io
parameters: {type: pd-standard}
# Retain, not the Delete reclaim policy of every GKE built-in class - Postgres is
# this app's source of truth, so the underlying disk must survive even if the
# PVC/PV/Cluster is deleted by mistake.
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
