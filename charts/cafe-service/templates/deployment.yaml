apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.db.enabled }}
  # A pod waiting in wait-for-db makes no rollout progress, so the default 600s deadline would
  # mark a legitimate first rollout failed. The slowest legitimate path to ready, about 930s:
  #   - 600s: wait-for-db's window;
  #   - ~8s: its last attempt past the window (assuming DNS answers promptly);
  #   - 10s: the default back-off before the initContainer restarts with a fresh window, when the
  #     database comes up just after the first window ran out (it then connects at once);
  #   - 300s: up to 30 x 10s of startup probe;
  #   - 10s: one readiness period.
  # 1200s leaves about 4.5 minutes for the image pulls and, when the autoscaler has to add a node,
  # its startup (including the CSI driver pod the secrets-store volume needs before any
  # initContainer runs). The pod never gives up by itself, so this deadline is what marks a
  # stalled rollout as failed. Services without a database have no wait-for-db and keep the 600s
  # default.
  progressDeadlineSeconds: 1200
  {{- end }}
  strategy:
    # Recreate for DB-backed services: avoids an old pod (old schema expectations) and a new pod
    # (post-Flyway-migration schema) running side by side during a rollout. Zero-downtime
    # deploys aren't a goal for this learning project, so the brief outage is an acceptable trade.
    type: {{ .Values.db.enabled | ternary "Recreate" "RollingUpdate" }}
  selector:
    matchLabels: {app: {{ .Values.appName }}}
  template:
    metadata:
      labels: {app: {{ .Values.appName }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.appName }}
      {{- if .Values.db.enabled }}
      initContainers:
        - name: wait-for-db
          # Just a psql client for connectivity checks - version-tolerant, doesn't need to
          # match the actual CNPG-managed server version (see k8s/data-layer/postgres-cluster.yaml,
          # which is where that version is pinned, via imageName).
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            # The script lives in files/wait-for-db.sh; `required` fails the render if it's missing.
            # It is inlined whole, comments included, so any edit to that file - even to a
            # comment - changes the pod template and rolls every DB-backed Deployment.
            - |
              {{- required "files/wait-for-db.sh is missing from the chart" (.Files.Get "files/wait-for-db.sh") | trimSuffix "\n" | nindent 14 }}
          # libpq's own variables, which the script's bare `psql` reads.
          env:
            - {name: PGHOST, value: {{ .Values.db.host | quote }}}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: {{ .Values.db.credentialsSecretName }}, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.db.credentialsSecretName }}, key: password}
            - {name: PGDATABASE, value: {{ .Values.db.name | quote }}}
            # Caps each psql attempt's connection; without it one attempt against an unreachable
            # host can hang for minutes, and the loop only checks its 600s window between attempts.
            - {name: PGCONNECT_TIMEOUT, value: "5"}
          resources: {{ toYaml .Values.initContainer.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            {{- if .Values.db.enabled }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ .Values.db.credentialsSecretName }}, key: username}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.db.credentialsSecretName }}, key: password}
            {{- end }}
            {{- if .Values.jwt.privateKey.enabled }}
            - name: APP_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.jwt.privateKey.secretName }}, key: private-key}
            {{- end }}
            {{- if .Values.jwt.publicKey.enabled }}
            - name: APP_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.jwt.publicKey.secretName }}, key: public-key}
            {{- end }}
            - {name: SPRING_CONFIG_IMPORT, value: "optional:file:/config/application.yml"}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          # Spring Boot auto-activates the /liveness and /readiness health groups when it
          # detects it's running in Kubernetes (via KUBERNETES_SERVICE_HOST) - no extra config
          # needed beyond exposing the base "health" endpoint, already done in each service's
          # own application.yml. Splitting them matters: readiness (which includes the db
          # check) can fail transiently on a DB blip without that also failing liveness and
          # triggering an unnecessary pod restart.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: {{ .Values.port }}}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: {{ .Values.port }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: {{ .Values.port }}}
            periodSeconds: 10
      volumes:
        - name: config
          configMap: {name: "{{ .Values.appName }}-config"}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: "{{ .Values.secretProviderClassName }}"}
