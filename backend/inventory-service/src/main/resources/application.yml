spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: inventory_service
    password: inventory_service_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.cafe.common.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # See order-service's application.yml for the full rationale: advertising
    # the auto-detected container/host IP breaks whichever caller sits on the
    # other side of the Docker/bare-process boundary. host.docker.internal
    # works uniformly here because Docker Desktop hairpins a container's own
    # published port back through it, so both other containers (gateway) and
    # bare-host processes (an IDE-run peer) can reach inventory-service
    # through the same advertised address - no docker-compose override needed.
    hostname: host.docker.internal
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
