spring:
  application:
    name: auth-service
  config:
    import: "configserver:"
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_service
    password: auth_service_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # See order-service's application.yml for the full rationale: advertising
    # the auto-detected container/host IP breaks whichever caller sits on the
    # other side of the Docker/bare-process boundary. host.docker.internal
    # works uniformly here because Docker Desktop hairpins a container's own
    # published port back through it, so both other containers (gateway) and
    # bare-host processes (an IDE-run peer) can reach auth-service through
    # the same advertised address - no docker-compose override needed.
    hostname: host.docker.internal
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
