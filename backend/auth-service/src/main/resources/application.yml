spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    # Intentionally blank - sourced from the SPRING_DATASOURCE_USERNAME env var
    # (docker-compose locally, a K8s Secret synced from GCP Secret Manager in the real deployment).
    username:
    # Intentionally blank - sourced from the SPRING_DATASOURCE_PASSWORD env var (same as above).
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # Trace everything - this is a learning/demo project. Lower this for a real deployment.
      probability: 1.0

app:
  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    # Intentionally blank - sourced from the APP_JWT_PRIVATE_KEY env var
    # (docker-compose locally, a K8s Secret synced from GCP Secret Manager in the real deployment).
    private-key:
