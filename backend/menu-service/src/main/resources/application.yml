spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:postgresql://localhost:5432/menu_db
    username: menu_service
    password: menu_service_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # Trace everything - this is a learning/demo project. Lower this for a real deployment.
      probability: 1.0
