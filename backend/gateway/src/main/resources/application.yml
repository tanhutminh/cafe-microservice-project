spring:
  application:
    name: gateway
  config:
    import: "configserver:"
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: inventory-recipe
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/menu-items/*/recipe
            - id: menu-service
              uri: lb://MENU-SERVICE
              predicates:
                - Path=/api/categories/**,/api/menu-items/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/tables/**,/api/orders/**
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/ingredients/**
            - id: report-service
              uri: lb://REPORT-SERVICE
              predicates:
                - Path=/api/reports/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
