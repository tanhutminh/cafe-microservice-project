spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Which frontend origin may call through the gateway - the textbook example of a
          # value that differs per environment (a real deployment's frontend domain, not
          # localhost) and needs changing without rebuilding the gateway image.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          # Path -> service routing table. Adding/moving a route is an operational/topology
          # change, not a code change, so it belongs here rather than baked into the image.
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: inventory-recipe
              uri: http://inventory-service:8084
              predicates:
                - Path=/api/menu-items/*/recipe
            - id: menu-service
              uri: http://menu-service:8082
              predicates:
                - Path=/api/categories/**,/api/menu-items/**
            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/tables/**,/api/orders/**
            - id: inventory-service
              uri: http://inventory-service:8084
              predicates:
                - Path=/api/ingredients/**
            - id: report-service
              uri: http://report-service:8085
              predicates:
                - Path=/api/reports/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # Trace everything - this is a learning/demo project. Lower this for a real deployment.
      probability: 1.0

