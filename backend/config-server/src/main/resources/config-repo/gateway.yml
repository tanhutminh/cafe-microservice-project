# Served by config-server to the client named "gateway" (spring.application.name).
management:
  tracing:
    sampling:
      # Trace everything - this is a learning/demo project. Lower this for a real deployment.
      probability: 1.0

# Public half of the auth-service RS256 keypair — safe to distribute, verify-only.
