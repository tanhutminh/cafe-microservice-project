    public-key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7ZYZTMITaRxKkPm9FV4p
      dVPEY4o6IXrRBTl0xJj2N4HQDDa0VMztn08g/gC96X0uYsEP9nu+epb4ZFgz9+CX
      JqXWS6sjbQmtjaouvb+GAuwDkkQEIGlIzySRQMmADRIisBqGWRSNQ9HXNkrR3s3v
