# Served by config-server to the client named "order-service" (spring.application.name).
app:
  saga-reconciliation:
    # How long a saga can sit at STOCK_RESERVATION_REQUESTED with no reply before the
    # sweep treats it as stuck (inventory-service down, message lost, etc).
    stuck-threshold: 60s
    # After this many re-published attempts with still no reply, compensate the order
    # back to OPEN instead of retrying forever.
    max-retries: 3
    # How often OrderSagaReconciliationJob runs its sweep.
    sweep-interval: 30s
  outbox:
    # How often OutboxPoller sweeps for PENDING messages to claim and publish.
    poll-interval: 500ms
    # Max PENDING messages claimed per sweep.
    batch-size: 20
    # After this many failed publish attempts, a message is marked FAILED
    # permanently instead of going back to PENDING for another try.
    max-attempts: 5
    # How long OutboxMessagePublisher blocks on the Kafka send future before
    # treating an attempt as failed.
    publish-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      menu-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # A 404 (item genuinely not found) is a valid business response, not a
        # fault - it must not count against the breaker or trigger the fallback.
        ignore-exceptions:
          - com.cafe.common.exception.ResourceNotFoundException
  retry:
    instances:
      menu-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.cafe.common.exception.ResourceNotFoundException
          # The breaker is already open - retrying would just fail fast again
          # on every attempt for no benefit.
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
