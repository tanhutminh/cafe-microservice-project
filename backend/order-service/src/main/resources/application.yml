spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: order_service
    password: order_service_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      # Wrapped in ErrorHandlingDeserializer: DefaultErrorHandler (see KafkaErrorHandlingConfig)
      # can only route a record to the DLQ if deserialization failures are surfaced as a normal
      # listener exception - a raw deserializer throws inside KafkaConsumer.poll() itself, before
      # the error handler ever sees it.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.cafe.common.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Registering the auto-detected host IP breaks when this service runs bare
    # (e.g. from an IDE) alongside the rest of the stack in Docker: Windows may
    # pick a virtual adapter address (VPN/WSL/Hyper-V) that containers can't
    # route to, so the gateway's lb://ORDER-SERVICE calls hang/500. Advertise
    # host.docker.internal instead - Docker's Linux containers can always
    # reach the host through it. Dockerized runs override this back to
    # prefer-ip-address (see docker-compose.yml) since same-network container
    # IPs work fine there.
    hostname: host.docker.internal
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    circuitbreakers:
      enabled: true
