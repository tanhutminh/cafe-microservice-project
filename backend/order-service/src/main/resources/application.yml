spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    # Intentionally blank - sourced from the SPRING_DATASOURCE_USERNAME env var
    # (docker-compose locally, a K8s Secret synced from GCP Secret Manager in the real deployment).
    username:
    # Intentionally blank - sourced from the SPRING_DATASOURCE_PASSWORD env var (same as above).
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      # Wrapped in ErrorHandlingDeserializer: DefaultErrorHandler (see KafkaErrorHandlingConfig)
      # can only route a record to the DLQ if deserialization failures are surfaced as a normal
      # listener exception - a raw deserializer throws inside KafkaConsumer.poll() itself, before
      # the error handler ever sees it.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.cafe.common.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      # Lets KafkaTemplate.send() auto-inject the current span's traceparent onto outgoing
      # record headers - the mechanism the manual outbox/inbox span-bridging code relies on.
      observation-enabled: true
    listener:
      # Lets @KafkaListener auto-extract the parent span from an inbound record's traceparent
      # header - what gives OrderSaga's reply listeners full trace continuity for free,
      # since they run business logic inline (no Inbox pattern on this side).
      observation-enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      # Trace everything - this is a learning/demo project, and 100% sampling is what makes
      # the outbox/inbox round trip through Kafka reliably show up in Zipkin. Lower this for
      # a real deployment.
      probability: 1.0

app:
  clients:
    menu-service:
      base-url: http://menu-service:8082
  saga-reconciliation:
    # How long a saga can sit at STOCK_RESERVATION_REQUESTED or PAYMENT_REQUESTED with no
    # reply before the sweep treats it as stuck (inventory-service down, message lost, etc).
    stuck-threshold: 60s
    # After this many re-enqueued attempts with still no reply, compensate the order back
    # to its pre-attempt state (OPEN for a stuck reservation, CONFIRMED for a stuck
    # commit) instead of retrying forever.
    max-retries: 3
    # How often OrderSagaReconciliationJob runs its sweep.
    sweep-interval: 30s
  outbox:
    # Operational pause switch: false disables OutboxPoller's bean registration entirely
    # (not just its schedule), so nothing relays queued messages until this is flipped back.
    poll-enabled: true
    # How often OutboxPoller sweeps for PENDING messages to claim and publish.
    poll-interval: 500ms
    # Max PENDING messages claimed per sweep.
    batch-size: 20
    # After this many failed publish attempts, a message is marked FAILED
    # permanently instead of going back to PENDING for another try.
    max-attempts: 5
    # How long OutboxMessagePublisher blocks on the Kafka send future before
    # treating an attempt as failed.
    publish-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      menu-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # A 404 (item genuinely not found) is a valid business response, not a
        # fault - it must not count against the breaker or trigger the fallback.
        ignore-exceptions:
          - com.cafe.common.exception.ResourceNotFoundException
  retry:
    instances:
      menu-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.cafe.common.exception.ResourceNotFoundException
          # The breaker is already open - retrying would just fail fast again
          # on every attempt for no benefit.
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
