spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://localhost:5432/report_db
    # Intentionally blank - sourced from the SPRING_DATASOURCE_USERNAME env var
    # (docker-compose locally, a K8s Secret synced from GCP Secret Manager in the real deployment).
    username:
    # Intentionally blank - sourced from the SPRING_DATASOURCE_PASSWORD env var (same as above).
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    # 9094 is the PLAINTEXT_HOST listener - reachable from a bare-host run (e.g. an IDE),
    # unlike 9092 which only resolves inside the Docker network (see docker-compose.yml's
    # kafka service comment). order-service/inventory-service already default to this.
    bootstrap-servers: localhost:9094
    consumer:
      group-id: report-service
      auto-offset-reset: earliest
    template:
      # report-service has the spring-kafka dependency and a bootstrap-servers connection
      # wired (docker-compose) but no @KafkaListener/KafkaTemplate usage yet - this is a no-op
      # today, set proactively so tracing is consistent the moment it starts consuming
      # order.paid (its evident purpose, given the name and the wiring already in place).
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # Trace everything - this is a learning/demo project. Lower this for a real deployment.
      probability: 1.0
