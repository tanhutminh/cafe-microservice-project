spring:
  application:
    name: report-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/report_db
    username: report_service
    password: report_service_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    # 9094 is the PLAINTEXT_HOST listener - reachable from a bare-host run (e.g. an IDE),
    # unlike 9092 which only resolves inside the Docker network (see docker-compose.yml's
    # kafka service comment). order-service/inventory-service already default to this.
    bootstrap-servers: localhost:9094
    consumer:
      group-id: report-service
      auto-offset-reset: earliest

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # See order-service's application.yml for the full rationale: advertising
    # the auto-detected container/host IP breaks whichever caller sits on the
    # other side of the Docker/bare-process boundary. host.docker.internal
    # works uniformly here because Docker Desktop hairpins a container's own
    # published port back through it, so both other containers (gateway) and
    # bare-host processes (an IDE-run peer) can reach report-service through
    # the same advertised address - no docker-compose override needed.
    hostname: host.docker.internal
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
